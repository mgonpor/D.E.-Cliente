<div class="container">
    <button class="btn btn-primary" routerLink="/tablero/nuevo">Crear Tablero</button>
</div>
<div class="container">
    @for (tablero of tableros; track tablero.id) {
    <div class="board-container" [routerLink]="['/tablero', tablero.id]" [style.background]="tablero.fondo">
        <div class="board-header">
            <h2>{{tablero.nombre}}</h2>
        </div>
    </div>
    }
</div>
