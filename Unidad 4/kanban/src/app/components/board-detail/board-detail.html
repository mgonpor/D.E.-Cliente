<div class="container" [style.background-color]="tablero?.fondo">
    <h1>{{ tablero?.nombre }}</h1>
    <div class="columns">
        @for (columna of columnas; track columna.id) {
        <div class="column" [style.background-color]="columna.color">
            <h2>{{ columna.nombre }}</h2>

        </div>
        }
    </div>
</div>
