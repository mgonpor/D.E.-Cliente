<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Equipos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <h2>Equipos Liga</h2>
        <p><a href="index.html">Inicio</a></p>
    </header>
    <main>
        <div class="tabla">
            <table>
                <thead>
                    <tr id="titulos">
                        <th>Equipo</th>
                        <th>PTS</th>
                        <th>PJ</th>
                        <th>G</th>
                        <th>E</th>
                        <th>P</th>
                        <th>GF</th>
                        <th>GC</th>
                    </tr>
                </thead>
                <tbody id="clasificacion">

                </tbody>
            </table>
        </div>
        <div class="formulario">
            <form action="">
                <label for="local">Equipo Local: </label>
                <select name="local" id="local">

                </select>

                <label for="visitante">Equipo Visitante: </label>
                <select name="visitante" id="visitante">

                </select>

                <label for="golesLocal">Goles local: </label>
                <input type="number" name="golesLocal" id="golesLocal">

                <label for="golesVisitante">Goles visitante: </label>
                <input type="number" name="golesVisitante" id="golesVisitante">

                <p id="validacionEquipos"></p>
            </form>
            <button onclick="validarEquipos()">Enviar</button>
        </div>
    </main>
    <footer>
        <p>Miguel González - Proyecto Amplicación</p>
    </footer>
</body>
</html>
